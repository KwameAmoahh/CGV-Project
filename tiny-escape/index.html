<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Character Demo</title>
  <!-- Preload UI music to start it as fast as possible -->
  <link rel="preload" href="/assets/models/ui_song.mp3" as="audio">
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    #hud {
      position: absolute; top: 10px; left: 10px;
      color: white; background: rgba(0,0,0,0.5);
      padding: 10px; border-radius: 5px;
    }
  </style>
</head>
<body>
  <!-- Hidden audio element that preloads for instant playback -->
  <audio id="ui-music" src="/assets/models/ui_song.mp3" loop preload="auto"></audio>

  <div id="root"></div>

  <div id="hud">
    <h3>Controls</h3>
    <p>WASD: Move<br>Shift: Toggle Run</p>
    <div id="level-info" style="margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 10px;">
      <p id="level-text" style="margin: 5px 0; font-weight: bold;">Level 1</p>
      <p id="timer-text" style="margin: 5px 0; color: #ffaa00;">Time: 120s</p>
      <p id="warning-text" style="margin: 5px 0; color: #ff5555; font-size: 13px;">The chef is coming back soon!<br>Go to checkpoint for safety.</p>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>

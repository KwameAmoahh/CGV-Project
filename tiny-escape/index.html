<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Character Demo</title>
  <!-- Preload UI music to start it as fast as possible -->
  <link rel="preload" href="/assets/models/ui_song.mp3" as="audio">
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    #hud {
      position: absolute; top: 10px; left: 10px;
      color: white; background: rgba(0,0,0,0.5);
      padding: 10px; border-radius: 5px;
    }
  </style>
</head>
<body>
  <!-- Hidden audio element that preloads for instant playback -->
  <audio id="ui-music" src="/assets/models/ui_song.mp3" loop preload="auto"></audio>

  <div id="root"></div>

  <div id="hud">
    <h3>Controls</h3>
    <p>WASD: Move<br>Shift: Toggle Run</p>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
